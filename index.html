<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#d8a3a6;background-attachment:fixed;color:#4a2010;font-family:'Oswald',system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:520px;padding:56px 22px 40px;text-align:center}
.av.logo{width:100%;max-width:none;height:auto;border-radius:0;box-shadow:none;margin:-24px auto 0}
.av{width:120px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.av.ph{display:grid;place-items:center;font-size:32px;font-weight:700;background:#5e2c16;color:#fbeeee}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em;text-transform:uppercase;color:#5e2c16;}
.handle{color:#5e2c16;font-family:'Space Mono',monospace;font-size:14px;margin:0 0 10px}
.bio{font-size:15px;line-height:1.45;opacity:.9;margin:0 auto 26px;max-width:380px;white-space:pre-line}
.links{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.btn{display:block;padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:600;font-size:15px;background:#5e2c16;color:#fbeeee;border:2px solid #5e2c16;transition:transform .15s,box-shadow .15s}
.btn.wa{display:flex;align-items:center;justify-content:center;gap:9px}
.btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.social{display:flex;gap:18px;justify-content:center;margin-top:30px}
.social a{color:#5e2c16;opacity:.85;transition:opacity .15s}
.social a:hover{opacity:1}
</style>
